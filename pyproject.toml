[project]
name = "tabular-showdown"
version = "0.1.0"
description = "TabPFN v2 vs tuned LightGBM on Adult census income — model quality as a function of training-set size"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    # Pinned: last version whose TabPFN-v2 weights download freely from Hugging Face.
    # tabpfn >= 3.x requires a Prior Labs account + TABPFN_TOKEN (Needs owner).
    "tabpfn==2.0.9",
    "shap>=0.46",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
